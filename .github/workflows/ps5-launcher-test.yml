name: PS5 runtime-enabled test build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/persistent-encrypted-sessions
    paths:
      - 'cmake/HomebrewPS5.cmake'
      - 'CMakeLists.txt'
      - 'cmake/PackagePS5.cmake'
      - 'src/homebrew/ps5.cpp'
      - 'src/homebrew/controller.cpp'
      - 'src/homebrew/controller.hpp'
      - 'src/steam/backend/depot_installer.h'
      - 'scripts/build-homebrew-ps5.sh'
      - '.github/workflows/ps5-launcher-test.yml'
      - 'tools/install_ps5_bundle.py'
      - 'tools/console_kit_upload.py'
      - 'scripts/fetch-deps.sh'
      - 'dependencies.lock.json'
permissions:
  contents: read
jobs:
  ps5-test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize required pinned submodules only
        run: |
          git submodule sync --recursive
          git submodule update --init --depth 1 -- \
            third_party/ps5-native-app-boilerplate \
            third_party/ps5-homebrew-ui \
            third_party/prospero-win \
            third_party/ps5-opengl \
            third_party/prospero-foundation \
            third_party/PS5-Lapy-JB-Daemon
          test -f third_party/ps5-homebrew-ui/tools/font-baker/bake_font.cpp
          git submodule status
      - name: Preflight pinned dependency URLs
        run: |
          python3 - <<'PY'
          import json, subprocess
          lock=json.load(open('dependencies.lock.json'))
          urls=[lock['ps5_payload_sdk']['url'],lock['prospero_launcher_helper']['payload_sdk']['url'],lock['ps5_opengl']['sdk_url'],lock['compiler_rt_builtins']['url']]
          failures=[]
          for url in urls:
              result=subprocess.run(['curl','-fsSL','--retry','1','--range','0-0','-o','/dev/null','-w','%{http_code}',url],capture_output=True,text=True)
              print(f'{result.stdout.strip()} {url}')
              if result.returncode: failures.append(url)
          if failures: raise SystemExit('Pinned dependency URLs unavailable: '+', '.join(failures))
          PY
      - name: Install native build prerequisites
        run: |
          brew install cmake ninja llvm@18 pkgconf sdl2-compat python@3.12 autoconf automake libtool
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
      - name: Fetch verified PS5 SDK and dependencies
        run: bash scripts/fetch-deps.sh
      - name: Build title-scoped runtime helper
        run: bash scripts/build-lapy-helper.sh FAKE77031
      - name: Build runtime-enabled test payload
        env:
          Z3CLOUDPLAY_NATIVE_RUNTIME_ACCESS: "ON"
          Z3CLOUDPLAY_EXPERIMENTAL_ARCHIVE_REBUILD: "ON"
          Z3CLOUDPLAY_UI_SIMULATION: "OFF"
          LLVM_CONFIG: /opt/homebrew/opt/llvm@18/bin/llvm-config
        run: bash scripts/build-homebrew-ps5.sh
      - name: Verify signed executable exists
        run: |
          test -s build/homebrew-ps5/dist/FAKE77031/eboot.bin
          test -s build/homebrew-ps5/dist/FAKE77031/sce_sys/param.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("build/homebrew-ps5/dist/FAKE77031/sce_sys/param.json").read_text())
          assert p["titleId"]=="FAKE77031"
          assert p["contentId"]=="UP9000-FAKE77031_00-Z3CLOUDPLAY00001"
          assert len(p["contentId"])==36
          print("PS5 registration metadata validated")
          PY
          test -s build/homebrew-ps5/dist/FAKE77031/z3cloudplay-package.identity
          shasum -a 256 build/homebrew-ps5/dist/FAKE77031/eboot.bin
      - name: Archive PS5 homebrew folder
        run: |
          cd build/homebrew-ps5/dist
          zip -qr "$GITHUB_WORKSPACE/z3cloudplay-ps5-runtime-test.zip" FAKE77031
      - uses: actions/upload-artifact@v4
        with:
          name: z3cloudplay-ps5-runtime-test
          path: z3cloudplay-ps5-runtime-test.zip
          if-no-files-found: error
          retention-days: 7

      - name: Fetch upstream runtime kit for combined distribution
        run: |
          curl --fail --location --retry 3 --output playden-kit-h-r8.zip \
            https://github.com/leolobato/playden-ps5/releases/download/v0.2.0/playden-kit-h-r8.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          import json
          with ZipFile("playden-kit-h-r8.zip") as kit:
              entries=[n for n in kit.namelist() if n.endswith("/manifest.json") or n=="manifest.json"]
              if len(entries)!=1:
                  raise SystemExit(f"unexpected manifest count: {len(entries)}")
              manifest=json.loads(kit.read(entries[0]))
              assert manifest.get("kit_id")=="hl2-fw1360-dev1", manifest.get("kit_id")
              print("Kit identity:",manifest["kit_id"],"declared firmware:",manifest.get("firmware"))
          PY
      - name: Package combined one-step FTP installer
        run: |
          mkdir -p z3cloudplay-complete
          cp playden-kit-h-r8.zip z3cloudplay-complete/
          cp tools/console_kit_upload.py tools/install_ps5_bundle.py z3cloudplay-complete/
          cp -R build/homebrew-ps5/dist/FAKE77031 z3cloudplay-complete/
          cat > z3cloudplay-complete/README.txt <<'EOF'
          Z3CloudPlay combined experimental kit, PS5 11.00.
          REQUIREMENTS: Python 3.10+ on a PC, PS5 FTP enabled, kstuff, ShadowMount+, ELF Loader.
          Kit H r8 targets firmware 13.60. PS5 11.00 runtime compatibility is NOT verified.
          Stop Z3CloudPlay, back up your application and runtime data.
          Run from this folder:
            python install_ps5_bundle.py --host PS5_IP
          For kit-only installation (leave the current launcher untouched):
            python install_ps5_bundle.py --host PS5_IP --kit-only
          Type EXPERIMENTAL to confirm. A new application must first be registered by ShadowMount+.
          EOF
          python3 -m py_compile tools/install_ps5_bundle.py tools/console_kit_upload.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('z3cloudplay-complete')
          for name in ['playden-kit-h-r8.zip','install_ps5_bundle.py','console_kit_upload.py','FAKE77031/eboot.bin','README.txt']:
              assert (p/name).is_file(), name
          print('Combined bundle inputs verified')
          PY
          zip -qr z3cloudplay-complete.zip z3cloudplay-complete
          unzip -tq z3cloudplay-complete.zip
      - uses: actions/upload-artifact@v4
        with:
          name: z3cloudplay-complete-ps5-experimental
          path: z3cloudplay-complete.zip
          if-no-files-found: error
          retention-days: 7
