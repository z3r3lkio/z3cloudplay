name: PS5 launcher test build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/persistent-encrypted-sessions
    paths:
      - 'cmake/HomebrewPS5.cmake'
      - 'CMakeLists.txt'
      - 'cmake/PackagePS5.cmake'
      - 'src/homebrew/ps5.cpp'
      - 'src/homebrew/controller.cpp'
      - 'src/homebrew/controller.hpp'
      - 'scripts/build-homebrew-ps5.sh'
      - '.github/workflows/ps5-launcher-test.yml'
permissions:
  contents: read
jobs:
  ps5-test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate pinned submodules
        run: |
          git submodule status
          test -f third_party/ps5-homebrew-ui/tools/font-baker/bake_font.cpp
      - name: Install native build prerequisites
        run: |
          brew install cmake ninja llvm@18 pkgconf sdl2-compat python@3.12 autoconf automake libtool
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
      - name: Fetch verified PS5 SDK and dependencies
        run: bash scripts/fetch-deps.sh
      - name: Build launcher-only test payload
        env:
          Z3CLOUDPLAY_NATIVE_RUNTIME_ACCESS: "OFF"
          Z3CLOUDPLAY_EXPERIMENTAL_ARCHIVE_REBUILD: "ON"
          Z3CLOUDPLAY_LAPY_HELPER_ELF: ""
          Z3CLOUDPLAY_LAPY_HELPER_MANIFEST: ""
          Z3CLOUDPLAY_UI_SIMULATION: "OFF"
          LLVM_CONFIG: /opt/homebrew/opt/llvm@18/bin/llvm-config
        run: bash scripts/build-homebrew-ps5.sh
      - name: Verify signed executable exists
        run: |
          test -s build/homebrew-ps5/dist/FAKE77031/eboot.bin
          test -s build/homebrew-ps5/dist/FAKE77031/sce_sys/param.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("build/homebrew-ps5/dist/FAKE77031/sce_sys/param.json").read_text())
          assert p["titleId"]=="FAKE77031"
          assert p["contentId"]=="UP9000-FAKE77031_00-Z3CLOUDPLAY00001"
          assert len(p["contentId"])==36
          print("PS5 registration metadata validated")
          PY
          test -s build/homebrew-ps5/dist/FAKE77031/z3cloudplay-package.identity
          shasum -a 256 build/homebrew-ps5/dist/FAKE77031/eboot.bin
      - name: Archive PS5 homebrew folder
        run: |
          cd build/homebrew-ps5/dist
          zip -qr "$GITHUB_WORKSPACE/z3cloudplay-ps5-launcher-test.zip" FAKE77031
      - uses: actions/upload-artifact@v4
        with:
          name: z3cloudplay-ps5-launcher-test
          path: z3cloudplay-ps5-launcher-test.zip
          if-no-files-found: error
          retention-days: 7
