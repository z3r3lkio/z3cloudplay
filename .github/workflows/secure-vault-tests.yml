name: Secure Vault Crypto Tests
on:
  push:
    branches: [main]
    paths:
      - 'src/steam/secure_session_vault.*'
      - 'tests/secure_session_vault_test.cpp'
      - '.github/workflows/secure-vault-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Mbed TLS headers and library
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Compile vault security tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I src \
            src/steam/secure_session_vault.cpp tests/secure_session_vault_test.cpp \
            -lmbedcrypto -o /tmp/z3cloudplay-secure-vault-test
      - name: Run vault security tests
        run: /tmp/z3cloudplay-secure-vault-test
