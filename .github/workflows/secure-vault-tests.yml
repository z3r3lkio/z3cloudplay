name: Secure Vault Crypto Tests
on:
  push:
    branches: [main]
    paths:
      - 'src/steam/secure_session_vault.*'
      - 'src/steam/secure_session_repository.*'
      - 'tests/secure_session_repository_test.cpp'
      - 'tests/secure_session_vault_test.cpp'
      - 'src/steam/ephemeral_session_repository.h'
      - 'src/homebrew/ps5.cpp'
      - '.github/workflows/secure-vault-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Mbed TLS headers and library
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Compile vault security tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I src \
            src/steam/secure_session_vault.cpp tests/secure_session_vault_test.cpp \
            -lmbedcrypto -o /tmp/z3cloudplay-secure-vault-test
      - name: Compile encrypted repository integration test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I src \
            src/platform/storage.cpp src/steam/secure_session_vault.cpp \
            src/steam/secure_session_repository.cpp \
            tests/secure_session_repository_test.cpp -lmbedcrypto \
            -o /tmp/z3cloudplay-secure-repository-test
      - name: Run encrypted repository integration test
        run: /tmp/z3cloudplay-secure-repository-test
      - name: Check PS5 credential policy
        run: |
          python3 -c 'from pathlib import Path; s=Path("src/homebrew/ps5.cpp").read_text(); assert "EphemeralSessionRepository sessions;" in s; assert "LocalSessionRepository sessions(" not in s; assert "credential_cleanup.Remove(" in s'
      - name: Run vault security tests
        run: /tmp/z3cloudplay-secure-vault-test
